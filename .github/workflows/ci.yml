name: CI

# push is limited to main so PR branches run each check once (via the
# pull_request event) instead of twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  gem:
    name: Gem (Rails ${{ matrix.rails }}, Ruby ${{ matrix.ruby }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rails:
          - rails_7_2
          - rails_8_0
          - rails_8_1
        ruby:
          - '3.2'
          - '3.3'
          - '3.4'
          - '4.0'
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/${{ matrix.rails }}.gemfile
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Run gem specs
        run: bundle exec rspec

  lint:
    name: Lint (RuboCop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - name: Run RuboCop
        run: bundle exec rubocop

  # Aggregate gate: branch protection requires this single check instead of
  # naming every matrix cell, so growing the Ruby/Rails matrix never needs a
  # ruleset update. if: always() makes it report a real failure (not a skip)
  # when any dependency fails.
  ci-ok:
    name: CI OK
    if: always()
    needs: [gem, lint]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: All required jobs passed
        run: echo "ok"
